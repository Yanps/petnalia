packages:
  - 'apps/*'
  - 'packages/*'

# Allow post-install build scripts for native modules and code generators.
# Required by pnpm 10's secure-by-default build script policy.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - esbuild
  - msgpackr-extract
  - sharp
  - unrs-resolver

# Security overrides for vulnerable transitive dependencies (pnpm audit --prod, high/critical).
# Remove an entry once the parent package ships the patched version on its own.
overrides:
  'proxy-addr@<2.0.8': ^2.0.8
  'body-parser@>=1 <1.20.9': ^1.20.9
  'multer@<2.5.0': ^2.5.0
  'lodash@<4.18.0': ^4.18.0
  'brace-expansion@>=1 <1.1.20': ^1.1.20
  'js-yaml@>=4 <4.3.2': ^4.3.2
  'effect@<3.22.1': ^3.22.1
  'deepmerge-ts@<8': ^8.0.0
  'postcss@<8.5.18': ^8.5.18
  'nanoid@>=3 <3.3.18': ^3.3.18
  'source-map-js@<1.2.2': ^1.2.2
  'sharp@<0.35.5': ^0.35.5
  'fast-uri@<3.1.7': ^3.1.7
  'browserslist@<4.28.7': ^4.28.7
  'vite@>=7 <7.3.7': ^7.3.7
